ad2210_planning:
  timezone: 'Europe/Paris'
  locale: 'fr_FR'

  # endpoints de l'API pour traitement des requêtes
  api:
    list_url:               '/api/planning/slots'
    show_url:               '/api/planning/slots/{id}'
    create_url:             '/api/planning/slots'
    update_url:             '/api/planning/slots/{id}'
    duplicate_url:          '/api/planning/slots/{id}/duplicate'
    delete_url:             '/api/planning/slots/{id}'
    csrf_header:            'X-CSRF-TOKEN'
    csrf_token_id:          'planning_api'

    # Payload envoyé vers l'API'
    #{
    #  "start_at": "2025-11-09T13:30:00",
    #  "end_at":   "2025-11-09T15:00:00",
    #  "timezone": "Europe/Paris",
    #  "user_id":  12,
    #  "project_id": null
    #}

  # valeurs par défaut (facultatives)
  toolbar:
    anchor_location: toolbar
    selector_location: toolbar
    views:
      day: true
      week: true
      workweek: true
      month:
        enable: true
        show_weekends: true

  grid:
    work_start: '07:00'
    work_end: '19:00'
    overflow_hours: 2               # int en heures
    now_indicator: true
    highlight_current_day: true
    minute_step: 30                 # int en minutes
    half_hour_opacity: 0.25         # float entre 0 et 1
    day_label_format: 'EEE d MMM'   # Format ICU
    time_label_format: 'HH:mm'      # Format ICU

  # Surcharge par mode
  modes:
    global:
      toolbar:
        anchor_location: toolbar
        views:
          day: true
          week: true
          workweek: true
          month:
            enable: false
            show_weekends: false
      grid:
        minute_step: 60

    user:
      toolbar:
        anchor_location: sidebar
        selector_location: sidebar
        views:
          day: false
          week: true
          workweek: true
          month:
            enable: true
            show_weekends: true
      grid:
        minute_step: 30

    project:
      toolbar:
        anchor_location: sidebar
        selector_location: sidebar
        views:
          day: false
          week: true
          workweek: true
          month:
            enable: true
            show_weekends: true
